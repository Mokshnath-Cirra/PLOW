name: plow_plant_care
description: "PLOW - Plant Care Reminder Web App for Flutter UI Design Project"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  intl: ^0.19.0
  google_fonts: ^6.1.0
  http: ^1.2.0
  image_picker: ^1.1.2
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/plants.json
    - assets/data/diseases.json
