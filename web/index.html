<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="FloraScan & PLOW — Advanced Phytosanitary AI leaf diagnosis, plant care reminders, and botanical directory with 180+ plant species.">
  <meta name="keywords" content="plant identification, plant disease detection, leaf scan, plant care reminder, botany, agronomy, flutter web">
  <meta property="og:title" content="FloraScan & PLOW — AI Plant Care & Disease Detection">
  <meta property="og:description" content="Identify plants, detect diseases, and track watering schedules with verified botanical guides.">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FloraScan & PLOW">

  <title>FloraScan & PLOW — AI Plant Care & Phytosanitary Diagnosis</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <style>
    body {
      background-color: #F8FAF7;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #2D6A4F;
    }
    .spinner {
      border: 4px solid #D8F3DC;
      border-top: 4px solid #2D6A4F;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading-container">
    <div style="font-size: 48px; margin-bottom: 16px;">🌱</div>
    <div class="spinner"></div>
    <p style="margin-top: 18px; font-weight: 600; letter-spacing: 0.5px;">Loading PLOW Plant Care...</p>
  </div>
  <script src="flutter.js" defer></script>
  <script>
    window.addEventListener('load', function(ev) {
      if (window._flutter) {
        _flutter.loader.loadEntrypoint({
          serviceWorker: {
            serviceWorkerVersion: null,
          },
          onEntrypointLoaded: function(engineInitializer) {
            engineInitializer.initializeEngine().then(function(appRunner) {
              const loading = document.getElementById('loading');
              if (loading) loading.remove();
              appRunner.runApp();
            });
          }
        });
      }
    });
  </script>
</body>
</html>
